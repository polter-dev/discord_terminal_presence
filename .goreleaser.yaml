version: 2

project_name: termp

builds:
  - id: termp
    main: ./cmd/termp
    binary: termp
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{ .Version }} -X main.commit={{ .Commit }} -X main.date={{ .Date }}
  - id: termp-windows
    main: ./cmd/termp
    binary: termp
    env:
      - CGO_ENABLED=0
    goos:
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{ .Version }} -X main.commit={{ .Commit }} -X main.date={{ .Date }}

archives:
  - id: termp
    ids:
      - termp
    formats:
      - tar.gz
    name_template: "termp_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - LICENSE
  - id: termp-windows
    ids:
      - termp-windows
    formats:
      - zip
    name_template: "termp_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - LICENSE

checksum:
  name_template: checksums.txt
  algorithm: sha256

nfpms:
  - id: termp
    ids:
      - termp
    package_name: termp
    vendor: polter-dev
    homepage: https://github.com/polter-dev/discord_terminal_presence
    maintainer: polter-dev
    description: Discord Rich Presence daemon for terminal tools.
    license: MIT
    formats:
      - deb
      - rpm
    bindir: /usr/bin
    scripts:
      postinstall: scripts/postinstall.sh

homebrew_casks:
  - name: termp
    # The release.published workflow uploads this generated cask after approval.
    skip_upload: true
    binaries:
      - termp
    repository:
      owner: polter-dev
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Casks
    homepage: https://github.com/polter-dev/discord_terminal_presence
    description: Discord Rich Presence daemon for terminal tools.
    caveats: |

      +------------------------------------------------------------------------------+
      |                                                                              |
      |   TERMP SETUP                                                                |
      |                                                                              |
      |   AFTER HOMEBREW FINISHES, RUN:                                              |
      |                                                                              |
      |                            >>>  termp setup  <<<                             |
      |                                                                              |
      |   Discord stays blank until you do.                                          |
      |                                                                              |
      +------------------------------------------------------------------------------+

    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/termp"]
          end

scoops:
  - name: termp
    # The release.published workflow uploads this generated manifest after approval.
    skip_upload: true
    ids:
      - termp-windows
    repository:
      owner: polter-dev
      name: scoop-bucket
      token: "{{ .Env.SCOOP_BUCKET_GITHUB_TOKEN }}"
    homepage: https://github.com/polter-dev/discord_terminal_presence
    description: Discord Rich Presence daemon for terminal tools.
    license: MIT
    post_install:
      - "Write-Host ''"
      - "Write-Host '+--------------------------------------------------------------------------+'"
      - "Write-Host '|                                                                          |'"
      - "Write-Host '|   TERMP INSTALLED                                                        |'"
      - "Write-Host '|                                                                          |'"
      - "Write-Host '|   NEXT STEP - RUN THIS NOW:                                              |'"
      - "Write-Host '|                                                                          |'"
      - "Write-Host '|                        >>>  termp setup  <<<                             |'"
      - "Write-Host '|                                                                          |'"
      - "Write-Host '|   Discord stays blank until you do.                                      |'"
      - "Write-Host '|                                                                          |'"
      - "Write-Host '+--------------------------------------------------------------------------+'"
      - "Write-Host ''"

release:
  # The Homebrew tap and Scoop bucket repositories must exist before running goreleaser release.
  draft: true
  extra_files:
    - glob: ./dist/homebrew/Casks/termp.rb
    - glob: ./dist/scoop/termp.json
