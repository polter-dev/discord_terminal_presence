name: Windows autostart verification

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows-autostart:
    # Installs the real GoReleaser archive and Scoop manifest, then registers and
    # runs the real scheduled task (#472, #545). It cannot observe a real logon
    # or whether a console window is visible: the runner has no interactive
    # desktop. Those checks stay with the owner on hardware.
    name: Windows autostart from shipped and Scoop installs
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Build snapshot release artifacts
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: v2.17.0
          args: release --snapshot --clean --skip=publish

      - name: Install the pseudo-console driver for the setup check
        run: python -m pip install --disable-pip-version-check pywinpty==3.0.5

      - name: "Throwaway #662: ending the task stops the daemon"
        shell: pwsh
        run: ./.github/scripts/windows-662-lifecycle.ps1 -Dist dist
