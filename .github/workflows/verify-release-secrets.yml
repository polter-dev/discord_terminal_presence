name: Verify release secrets

on:
  workflow_dispatch:

permissions: {}

jobs:
  verify:
    name: Verify publishing access
    runs-on: ubuntu-latest
    steps:
      - name: Verify HOMEBREW_TAP_GITHUB_TOKEN
        id: homebrew
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
        shell: bash
        run: |
          secret_name="HOMEBREW_TAP_GITHUB_TOKEN"
          target_repo="polter-dev/homebrew-tap"
          result="failure"

          if [[ -z "${GH_TOKEN:-}" ]]; then
            message="secret ${secret_name} is not set"
          else
            api_error_file="${RUNNER_TEMP}/homebrew-token-api-error"
            if push_access="$(gh api "/repos/${target_repo}" --jq '.permissions.push // false' 2>"${api_error_file}")"; then
              if [[ "${push_access}" == "true" ]]; then
                result="success"
                message="token ${secret_name} can write repo ${target_repo}"
              else
                message="token ${secret_name} can read but not write repo ${target_repo} — add Contents: Read and write. This is the exact permission failure that broke v0.1.0."
              fi
            else
              api_error="$(<"${api_error_file}")"
              case "${api_error}" in
                *"HTTP 404"*)
                  message="token ${secret_name} cannot see repo ${target_repo} (404 usually means the token is scoped to different repositories)"
                  ;;
                *"HTTP 401"* | *"HTTP 403"*)
                  message="token ${secret_name} cannot see repo ${target_repo} — check the resource owner and 'Only select repositories' scoping"
                  ;;
                *)
                  message="token ${secret_name} could not verify repo ${target_repo} because the GitHub API request failed unexpectedly"
                  ;;
              esac
            fi
          fi

          if [[ "${result}" == "success" ]]; then
            printf 'SUCCESS: %s\n' "${message}"
          else
            printf 'FAILURE: %s\n' "${message}"
          fi
          printf 'result=%s\n' "${result}" >> "${GITHUB_OUTPUT}"
          printf 'message=%s\n' "${message}" >> "${GITHUB_OUTPUT}"

      - name: Verify SCOOP_BUCKET_GITHUB_TOKEN
        id: scoop
        env:
          GH_TOKEN: ${{ secrets.SCOOP_BUCKET_GITHUB_TOKEN }}
        shell: bash
        run: |
          secret_name="SCOOP_BUCKET_GITHUB_TOKEN"
          target_repo="polter-dev/scoop-bucket"
          result="failure"

          if [[ -z "${GH_TOKEN:-}" ]]; then
            message="secret ${secret_name} is not set"
          else
            api_error_file="${RUNNER_TEMP}/scoop-token-api-error"
            if push_access="$(gh api "/repos/${target_repo}" --jq '.permissions.push // false' 2>"${api_error_file}")"; then
              if [[ "${push_access}" == "true" ]]; then
                result="success"
                message="token ${secret_name} can write repo ${target_repo}"
              else
                message="token ${secret_name} can read but not write repo ${target_repo} — add Contents: Read and write. This is the exact permission failure that broke v0.1.0."
              fi
            else
              api_error="$(<"${api_error_file}")"
              case "${api_error}" in
                *"HTTP 404"*)
                  message="token ${secret_name} cannot see repo ${target_repo} (404 usually means the token is scoped to different repositories)"
                  ;;
                *"HTTP 401"* | *"HTTP 403"*)
                  message="token ${secret_name} cannot see repo ${target_repo} — check the resource owner and 'Only select repositories' scoping"
                  ;;
                *)
                  message="token ${secret_name} could not verify repo ${target_repo} because the GitHub API request failed unexpectedly"
                  ;;
              esac
            fi
          fi

          if [[ "${result}" == "success" ]]; then
            printf 'SUCCESS: %s\n' "${message}"
          else
            printf 'FAILURE: %s\n' "${message}"
          fi
          printf 'result=%s\n' "${result}" >> "${GITHUB_OUTPUT}"
          printf 'message=%s\n' "${message}" >> "${GITHUB_OUTPUT}"

      - name: Report verification result
        env:
          HOMEBREW_RESULT: ${{ steps.homebrew.outputs.result }}
          HOMEBREW_MESSAGE: ${{ steps.homebrew.outputs.message }}
          SCOOP_RESULT: ${{ steps.scoop.outputs.result }}
          SCOOP_MESSAGE: ${{ steps.scoop.outputs.message }}
        shell: bash
        run: |
          failures=0

          if [[ "${HOMEBREW_RESULT}" == "failure" ]]; then
            printf '::error::%s\n' "${HOMEBREW_MESSAGE}"
            failures=$((failures + 1))
          fi
          if [[ "${SCOOP_RESULT}" == "failure" ]]; then
            printf '::error::%s\n' "${SCOOP_MESSAGE}"
            failures=$((failures + 1))
          fi

          if (( failures > 0 )); then
            printf 'Release secret verification failed for %d token(s).\n' "${failures}"
            exit 1
          fi

          printf 'All release publishing tokens have write access to their target repositories.\n'
