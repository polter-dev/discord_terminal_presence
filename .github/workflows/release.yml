name: Release

on:
  push:
    tags:
      - "v*"
  release:
    types:
      - published

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: v2.17.0
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-homebrew-cask:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - name: Download cask from public release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          test "$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" --jq .draft)" = "false"
          mkdir -p dist/homebrew/Casks
          gh release download "${RELEASE_TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --pattern termp.rb \
            --dir dist/homebrew/Casks

      - name: Publish cask to Homebrew tap
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          api_path="repos/polter-dev/homebrew-tap/contents/Casks/termp.rb"
          content="$(base64 -w 0 dist/homebrew/Casks/termp.rb)"
          existing_sha="$(gh api "${api_path}" --jq .sha 2>/dev/null || true)"
          generated_sha="$(git hash-object dist/homebrew/Casks/termp.rb)"

          if [[ "${existing_sha}" == "${generated_sha}" ]]; then
            echo "Homebrew cask is already current."
            exit 0
          fi

          args=(
            --method PUT
            "${api_path}"
            -f "message=chore: update termp cask for ${RELEASE_TAG}"
            -f "content=${content}"
          )
          if [[ -n "${existing_sha}" ]]; then
            args+=(-f "sha=${existing_sha}")
          fi

          gh api "${args[@]}"

  publish-scoop-manifest:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - name: Download manifest from public release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          test "$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" --jq .draft)" = "false"
          mkdir -p dist/scoop
          gh release download "${RELEASE_TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --pattern termp.json \
            --dir dist/scoop

      - name: Publish manifest to Scoop bucket
        env:
          GH_TOKEN: ${{ secrets.SCOOP_BUCKET_GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          api_path="repos/polter-dev/scoop-bucket/contents/termp.json"
          content="$(base64 -w 0 dist/scoop/termp.json)"
          existing_sha="$(gh api "${api_path}" --jq .sha 2>/dev/null || true)"
          generated_sha="$(git hash-object dist/scoop/termp.json)"

          if [[ "${existing_sha}" == "${generated_sha}" ]]; then
            echo "Scoop manifest is already current."
            exit 0
          fi

          args=(
            --method PUT
            "${api_path}"
            -f "message=chore: update termp manifest for ${RELEASE_TAG}"
            -f "content=${content}"
          )
          if [[ -n "${existing_sha}" ]]; then
            args+=(-f "sha=${existing_sha}")
          fi

          gh api "${args[@]}"
